<script>
(function(){
  function getCookie(name){
    var m = document.cookie.match(new RegExp('(?:^|; )'+name+'=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  var consent = getCookie('lvo_motion_consent');
  window.__LVO_MOTION_CONSENT__ = consent;
  if(consent === null){
    location.replace('https://warning.wearelvo.com/?return=' + encodeURIComponent(location.href));
  }
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=0">
<title>About · LVO Holdings</title>
<meta name="description" content="LVO Holdings — About Legion V. Omni-Operations.">
<link rel="icon" type="image/png" href="assets/logo.png">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--white:#fff;--dim:rgba(255,255,255,0.5);--dimmer:rgba(255,255,255,0.25);--purple:#7F77DD;--red-hi:#CC2020;--chrome:#C8C8D0;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Times New Roman',Georgia,serif;user-select:none;}

@media (pointer:coarse){ body{cursor:auto;} }
@media (pointer:fine){ body{cursor:none;} }

#loading-screen{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8rem;transition:opacity 0.8s ease;}
#loading-screen.fade-out{opacity:0;pointer-events:none;}
.ls-rule{width:1px;height:80px;background:linear-gradient(to bottom,transparent,var(--purple),transparent);animation:lsPulse 1.8s ease-in-out infinite;}
@keyframes lsPulse{0%,100%{opacity:.3}50%{opacity:1}}
.ls-name{font-family:'Cinzel',serif;font-size:2.8rem;font-weight:900;letter-spacing:.25em;color:#C8C8D0;line-height:1;}
.ls-sub{font-family:'Cormorant SC',serif;font-size:.48rem;letter-spacing:.5em;color:rgba(255,255,255,0.38);text-transform:uppercase;text-align:center;padding:0 1rem;}
.ls-bar{width:200px;height:1px;background:rgba(127,119,221,.2);overflow:hidden;position:relative;}
.ls-bar-fill{position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--purple),transparent);animation:lsBar 1.4s ease-in-out infinite;}
@keyframes lsBar{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}

/* Loading screen stays up for a minimum of 2s and until the landing
   slide's photo has actually finished loading, so there's never a flash
   of the shader's raw placeholder color underneath. */
#site-wrap{opacity:0;transition:opacity 0.8s ease;}
#site-wrap.visible{opacity:1;}

#stage{position:fixed;inset:-3%;z-index:0;background:transparent;will-change:transform;}
#stage canvas{width:100%!important;height:100%!important;display:block;}

#title{position:fixed;top:0;left:0;right:0;z-index:35;padding:clamp(14px,3vw,28px) clamp(16px,4vw,40px);}
#title a{text-decoration:none;color:var(--white);font-size:clamp(9px,2vw,13px);letter-spacing:0.3em;display:inline-flex;align-items:center;position:relative;}
#title-indicator{display:inline-block;width:40px;height:1px;background:var(--white);margin-left:12px;transform-origin:left center;transform:scaleX(0.75);transition:transform 0.4s;}
#title a:hover #title-indicator{transform:scaleX(1);}

#return-link{position:fixed;top:0;right:0;z-index:35;padding:clamp(14px,3vw,28px) clamp(16px,4vw,40px);}
#return-link a{text-decoration:none;color:var(--white);font-size:clamp(9px,2vw,13px);letter-spacing:0.3em;text-transform:uppercase;display:inline-flex;align-items:center;gap:12px;position:relative;}
#return-rune{display:inline-block;font-size:1.35em;line-height:1;color:var(--white);transform-origin:center;transition:transform 0.4s;}
#return-link a:hover #return-rune{transform:translateX(4px);}
@media(max-width:768px){
  #return-link-label{display:none;}
}

#stage-nav{position:fixed;top:50%;left:0;right:0;z-index:20;transform:translateY(-50%);overflow:hidden;pointer-events:none;}
#screen-page-nav{display:flex;list-style:none;transition:transform 0.8s cubic-bezier(0.77,0,0.175,1);will-change:transform;}
#screen-page-nav li{flex-shrink:0;display:flex;align-items:center;justify-content:center;pointer-events:all;}

#screen-controller{position:fixed;bottom:0;left:50%;z-index:35;transform:translateX(-50%);padding-bottom:clamp(12px,3vw,20px);pointer-events:all;}

#legal-links{position:fixed;bottom:clamp(12px,3vw,20px);right:clamp(16px,4vw,40px);z-index:35;display:flex;gap:1.2rem;pointer-events:all;}
#legal-links a{font-family:'Cinzel',serif;font-size:clamp(7px,1vw,9px);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,0.35);text-decoration:none;border-bottom:0.5px solid rgba(139,0,0,0.3);padding-bottom:2px;transition:color .3s,border-color .3s;}
#legal-links a:hover{color:var(--white);border-color:var(--red-hi);}
@media(max-width:600px){#legal-links{right:clamp(10px,3vw,20px);gap:0.8rem;}}
#screen-controller .inner{position:relative;display:flex;align-items:flex-end;}
#knob{position:absolute;bottom:0;left:0;display:flex;align-items:flex-end;transition:transform 0.8s cubic-bezier(0.77,0,0.175,1);pointer-events:none;z-index:2;}
.separator{display:block;width:1px;height:16px;background:var(--white);position:relative;bottom:-1px;}
#controller-parent{list-style:none;display:flex;align-items:flex-end;border-bottom:0.5px solid rgba(255,255,255,0.2);}
#controller-parent li{cursor:pointer;}
.numerator{display:block;font-size:clamp(9px,2vw,11px);letter-spacing:0.1em;color:var(--dimmer);padding:0 clamp(5px,1.5vw,8px) 8px;transition:color 0.3s;line-height:1;}
#controller-parent li.is-current .numerator{color:var(--white);}
.controller-item.is-symbol .numerator{font-size:clamp(11px,2vw,15px);letter-spacing:0;padding-bottom:6px;color:var(--dimmer);}
.controller-item.is-symbol.is-current .numerator{color:var(--white);}

#trailing-cursor-canvas{position:fixed;top:0;left:0;pointer-events:none;z-index:900;}

@media (max-width:768px){
  #stage{inset:0;transform:none!important;will-change:auto;}
  #title a span:first-child{display:none;}
  #title a::before{content:'LVO';font-family:'Cinzel',serif;font-size:13px;letter-spacing:.3em;color:var(--white);}
  #stage canvas{opacity:0.95;}
}

#video-bg{
  position:fixed;inset:0;z-index:5;

  opacity:0;
  transition:opacity 0.9s ease;
  pointer-events:none;
}
#video-bg.visible{ opacity:1; }
#stage{ z-index:10; background:#000; }

/* Symbol slide overlay — LVO wordmark, matches the main site's About text */
#about-hero{
  position:fixed;
  bottom:clamp(80px,12vh,130px);
  left:clamp(40px,7vw,120px);
  z-index:30;

}
#about-hero.visible{ opacity:1; }
@media(min-width:769px){

  #about-hero.visible{ transform:translateY(-50%); }
}
@media(max-width:768px){

    left:0 !important; right:0 !important; width:100%;
    bottom:auto; top:62%; transform:translateY(-50%);

}

  text-transform:uppercase;
}

/* Numbered slide content — full text pulled from each section */
#slide-content{
  position:fixed;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  padding:6.5rem 1.6rem 3rem;

  transition:opacity 0.6s ease;
}
#slide-content.visible{ opacity:1; pointer-events:auto; }
.slide-inner{

.slide-inner::-webkit-scrollbar{ width:4px; }
.slide-inner::-webkit-scrollbar-thumb{ background:rgba(139,0,0,0.35); }

.slide-eyebrow{
  font-family:'Cinzel',serif;
  font-size:clamp(8px,1.4vw,11px);
  letter-spacing:.4em;
  color:var(--red-hi);
  text-transform:uppercase;
  margin-bottom:1.1rem;
}
.slide-lvo{
  font-family:'Cinzel',serif;font-weight:900;
  font-size:clamp(2.1rem,7.5vw,4.2rem);
  letter-spacing:.2em;color:#fff;line-height:1;
  margin-bottom:.5rem;
}
.slide-subtitle{
  font-family:'Cinzel',serif;
  font-size:clamp(8px,1.6vw,12px);
  letter-spacing:.35em;color:var(--dim);
  text-transform:uppercase;margin-bottom:2rem;
}
.slide-heading-stack{
  font-family:'IM Fell English',Georgia,serif;font-style:italic;
  font-size:clamp(32px,6.5vw,72px);color:#fff;
  line-height:1.08;letter-spacing:.03em;margin-bottom:1.8rem;
  text-shadow:0 2px 40px rgba(0,0,0,0.9);
}
.slide-heading-stack span{ display:block; }
.slide-body-text{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:300;font-style:italic;
  font-size:clamp(0.95rem,2vw,1.12rem);line-height:1.9;
  color:rgba(240,238,236,0.8);max-width:620px;margin:0 auto;
}

.slide-list{ display:flex;flex-direction:column;gap:1.8rem;text-align:left;margin-top:0.5rem; }
.slide-list-item{ border-top:0.5px solid rgba(139,0,0,0.25);padding-top:1.1rem; }
.slide-list-num{
  font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.35em;

}
.slide-list-title{
  font-family:'Cinzel',serif;font-size:.82rem;font-weight:600;

  margin-bottom:.5rem;
}
.slide-list-text{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-style:italic;

}

.slide-quote{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-style:italic;

  color:#fff;opacity:.9;margin-bottom:1.8rem;
}
.slide-quote-attr{
  font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.4em;color:var(--red-hi);
}
</style>

  <div id="slide-content"><div class="slide-inner"></div></div>

  <!--
    Slide order reads 4 · 3 · 2 · 1 · symbol, left to right. To add a real
    photo to any of the four numbered slides, fill in that entry's img /
    mobile_img in the SLIDES array below — same pattern as wearelvo.com's
    index.html. Add another slide by inserting a new <li data-idx="N">
    here, a matching SLIDES entry, and a controller dot.

  <div id="stage-nav">

        <li class="nav-list controller-item" data-idx="3"><span class="numerator">1</span></li>
        <li class="nav-list controller-item is-symbol is-current" data-idx="4"><span class="numerator">♱ᛪ༙</span></li>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const isMobileDevice = window.innerWidth <= 768;
const isTablet = window.innerWidth > 768 && window.innerWidth <= 1024;

let WATER_INTENSITY = 0.028;
if (isMobileDevice) {
  WATER_INTENSITY = 0.015;
} else if (isTablet) {
  WATER_INTENSITY = 0.022;
}

const ASSETS = 'https://assets.wearelvo.com/';
function getImageUrl(desktopImg, mobileImg){ return isMobileDevice ? mobileImg : desktopImg; }

// Reversed order: numbered content slides first, symbol (the secret-transition
// landing photo) last. Fill in img/mobile_img on the numbered slides once you
// have photos for them — until then they render on the plain water backdrop.
const SLIDES = [
  {
    num:'4', img: ASSETS+'LVOAL.jpg', mobile_img: ASSETS+'LVOAP.JPG',
    type:'values',
    heading:['WHAT','WE','STAND FOR'],
    items:[
      { num:'I',   title:'Legacy Over Liquidity', text:'We measure success in decades, not quarters. Every decision is made with the next generation in mind — not the next exit.' },
      { num:'II',  title:'Discretion By Design',  text:'We do not court attention. The work speaks through results — quietly, consistently, without announcement.' },
      { num:'III', title:'Capital With Purpose',  text:'Through LVO Operations, we deploy resources into social services and community infrastructure. We believe ownership carries obligation.' },
      { num:'IV',  title:'Access Is Earned',      text:'Our Alliance arm moves on trust and track record — not pitch decks. Partnerships are built on shared values before shared returns.' }
    ]
  },
  {
    num:'3', img: ASSETS+'LVOAL.jpg', mobile_img: ASSETS+'LVOAP.JPG',
    type:'timeline',
    heading:['OUR','FOUNDATION'],
    items:[
      { year:'2026',    title:'Founded',            text:'LVO Holdings was established in Houston under a family trust — structured from the outset as a permanent, multigenerational holding entity rather than a fund or venture vehicle.' },
      { year:'Vindex',  title:'Real Estate',         text:'The first pillar — Vindex — was activated to acquire and develop properties positioned for generational appreciation. Protection of tangible assets is the bedrock of the structure.' },
      { year:'Ops',     title:'Operations',          text:'LVO Operations channels capital into social services and community infrastructure — because durable wealth requires durable communities. Where purpose is not the byproduct of profit, but its precondition.' },
      { year:'Alliance',title:'Strategic Ventures',  text:'LVO Alliance exists for the rare relationship — partnerships forged on aligned conviction. Capital deployed here moves slowly, intentionally, and only with full confidence in the people behind it.' }
    ]
  },
  {
    num:'2', img: ASSETS+'LVOAL.jpg', mobile_img: ASSETS+'LVOAP.JPG',
    type:'quote',
    heading:['OUR','ETHOS'],
    quote:'We were not built to be known.\nWe were built to endure.\nThe legacy is the work.',
    attribution:'LVO Holdings · U.S. · Est. 2026'
  },
  {
    num:'1', img: ASSETS+'LVOAL.jpg', mobile_img: ASSETS+'LVOAP.JPG',
    type:'hero',
    eyebrow:'Est. 2026 · Texas, United States',
    title:'LVO',
    subtitle:'Legion V · Omni-Operations',
    heading:['WHO','WE ARE'],
    text:'LVO Holdings is a private holding company rooted in the United States — built to own, operate, and steward assets across real estate, social infrastructure, and strategic capital ventures. We are not a firm that chases trends. We are a structure designed for permanence.'
  },
  {
    num:'symbol', img: ASSETS+'LVOAL.jpg', mobile_img: ASSETS+'LVOAP.JPG',
    type:'symbol'
  },
];
const TOTAL = SLIDES.length;
const SYMBOL_IDX = TOTAL - 1;

// Mirrors wearelvo.com's secret transition — swiping/clicking forward past
// the symbol slide blends into the main site's About photo, then hands off.
const HOME_SLIDE = { img: ASSETS+'LVO%20R.jpg', mobile_img: ASSETS+'LVO%20Mobile%20R.jpg' };
const HOME_URL = 'https://wearelvo.com/';

const VIDEO_SLIDES = new Set([]);
const videoBg  = document.getElementById('video-bg');
const stageCanvas = document.querySelector('#stage');
function updateVideoBackground(idx){
  if(VIDEO_SLIDES.has(idx)){
    videoBg.classList.add('visible');
    stageCanvas.classList.add('video-mode');
  } else {
    videoBg.classList.remove('visible');
    stageCanvas.classList.remove('video-mode');
  }
}
updateVideoBackground(SYMBOL_IDX);

const canvas = document.querySelector('#stage canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const geo    = new THREE.PlaneGeometry(2,2);

const vertSrc = `
varying vec2 vUv;
void main(){ vUv=uv; gl_Position=vec4(position,1.0); }
`;

const fragSrc = `
precision highp float;
uniform float uTime;
uniform float uBlend;
uniform sampler2D uTexA;
uniform sampler2D uTexB;
uniform int uHasTexA;
uniform int uHasTexB;
uniform float uWaterIntensity;
varying vec2 vUv;

float wave(vec2 p, float freq, float phase){
  return sin(p.x * freq + uTime * 0.3 + phase)
       * cos(p.y * freq * 0.8 + uTime * 0.2 + phase * 1.3);
}

void main(){
  vec2 uv = vUv;

  float w1 = wave(uv, 2.8,  0.0);
  float w2 = wave(uv, 4.9,  2.1);
  float w3 = wave(uv * 1.3, 1.9, 4.3);
  float w4 = wave(uv * 0.6, 6.2, 1.7);

  vec2 disp;
  disp.x = (w1*0.5 + w2*0.3 + w3*0.15 + w4*0.05) * uWaterIntensity;
  disp.y = (w2*0.5 + w1*0.25 + w4*0.2  + w3*0.05) * uWaterIntensity;
  vec2 wuv = clamp(uv + disp, 0.0, 1.0);

  vec3 colA, colB;
  if(uHasTexA == 1){ colA = texture2D(uTexA, wuv).rgb * 0.82; } else { colA = vec3(0.04, 0.02, 0.12); }
  if(uHasTexB == 1){ colB = texture2D(uTexB, wuv).rgb * 0.82; } else { colB = vec3(0.04, 0.02, 0.12); }

  float spec = max(0.0, w1 * 0.3 + w2 * 0.2 + 0.2);
  vec3 sheen = vec3(0.55, 0.52, 0.72) * pow(spec, 6.0) * 0.18;

  vec3 col = mix(colB, colA, clamp(uBlend, 0.0, 1.0));
  col += sheen;

  vec2 vig = uv * 2.0 - 1.0;
  col *= 1.0 - dot(vig, vig) * 0.38;

  float grain = fract(sin(dot(uv * 997.0, vec2(12.9898, 78.233))) * 43758.5453);
  col += grain * 0.018 - 0.009;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

function makePlaceholder(){
  const d=new Uint8Array([30,30,40,255]);
  const t=new THREE.DataTexture(d,1,1,THREE.RGBAFormat);
  t.needsUpdate=true; return t;
}

const placeholder = makePlaceholder();
const textures = new Array(TOTAL).fill(null);
const loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';

// Land directly on the symbol slide — that's the photo the main site's
// secret transition already blended into, so there's no visible seam.
let current = SYMBOL_IDX, transitioning=false, transitionStart=0;
const TRANS_DUR=900;

// Loading screen: minimum 2s, but never dismisses before the landing
// slide's photo is actually ready — avoids a flash of the shader's raw
// placeholder color. If that image ever fails to load entirely, the error
// callback below still flips the flag so the screen doesn't hang forever.
let landingTextureLoaded = false;

// Motion sickness gate: if the visitor declined on warning.wearelvo.com,
// skip every image load entirely — the water shader still runs, but always
// falls back to its plain placeholder color since textures stay empty.
const IMAGES_ALLOWED = window.__LVO_MOTION_CONSENT__ !== 'denied';

if(IMAGES_ALLOWED){
  SLIDES.forEach((s,i)=>{
    const imgUrl = getImageUrl(s.img, s.mobile_img);
    if(!imgUrl){ if(i===SYMBOL_IDX) landingTextureLoaded = true; return; }
    loader.load(imgUrl, tex=>{
      tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
      tex.minFilter=THREE.LinearFilter;
      textures[i]=tex;
      if(i===current){
        uniforms.uTexA.value=tex;
        uniforms.uHasTexA.value=1;
      }
      if(i===SYMBOL_IDX) landingTextureLoaded = true;
    }, undefined, ()=>{ if(i===SYMBOL_IDX) landingTextureLoaded = true; });
  });
} else {
  landingTextureLoaded = true;
}

let homeTexture = null;
if(IMAGES_ALLOWED){
  loader.load(getImageUrl(HOME_SLIDE.img, HOME_SLIDE.mobile_img), tex=>{
    tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
    tex.minFilter=THREE.LinearFilter;
    homeTexture = tex;
  });
}

// Loading screen dismissal: waits for the flag above plus a 2s minimum.
const loadingScreen = document.getElementById('loading-screen');
const siteWrap = document.getElementById('site-wrap');
function dismissLoader(){
  loadingScreen.classList.add('fade-out');
  siteWrap.classList.add('visible');
  setTimeout(()=>{ loadingScreen.style.display='none'; }, 900);
}
function waitForLanding(){
  if(landingTextureLoaded) dismissLoader();
  else setTimeout(waitForLanding, 100);
}
setTimeout(waitForLanding, 2000);

const uniforms = {
  uTime:           {value:0},
  uBlend:          {value:1},
  uTexA:           {value:placeholder},
  uTexB:           {value:placeholder},
  uHasTexA:        {value:0},
  uHasTexB:        {value:0},
  uWaterIntensity: {value:WATER_INTENSITY},
};

scene.add(new THREE.Mesh(geo, new THREE.ShaderMaterial({vertexShader:vertSrc,fragmentShader:fragSrc,uniforms})));

function resize(){ renderer.setSize(window.innerWidth, window.innerHeight); }
resize();
window.addEventListener('resize', resize);

const navUl=document.getElementById('screen-page-nav');
const ctrlUl=document.getElementById('controller-parent');
const knob=document.getElementById('knob');

function layoutNav(){
  const isMobile = window.innerWidth <= 768;
  const sw = isMobile ? window.innerWidth : window.innerWidth * 0.5;
  navUl.dataset.sw = sw;
  navUl.style.width=(sw*TOTAL)+'px';
  Array.from(navUl.children).forEach(li=>{ li.style.width=sw+'px'; li.style.minHeight='80px'; });
}
layoutNav();
window.addEventListener('resize', layoutNav);

const aboutHero = document.getElementById('about-hero');
const slideContent = document.getElementById('slide-content');
const slideInner = slideContent.querySelector('.slide-inner');

function headingStack(lines){
  return '<div class="slide-heading-stack">' + lines.map(l=>'<span>'+l+'</span>').join('') + '</div>';
}

function renderSlideContent(idx){
  const s = SLIDES[idx];
  if(s.type === 'symbol'){
    slideContent.classList.remove('visible');
    slideInner.innerHTML = '';
    aboutHero.classList.add('visible');
    return;
  }
  aboutHero.classList.remove('visible');
  let html = '';
  if(s.type === 'hero'){
    html += '<div class="slide-eyebrow">'+s.eyebrow+'</div>';
    html += '<div class="slide-lvo">'+s.title+'</div>';
    html += '<div class="slide-subtitle">'+s.subtitle+'</div>';
    html += headingStack(s.heading);
    html += '<p class="slide-body-text">'+s.text+'</p>';
  } else if(s.type === 'quote'){
    html += headingStack(s.heading);
    html += '<p class="slide-quote">'+s.quote.split('\n').join('<br/>')+'</p>';
    html += '<div class="slide-quote-attr">'+s.attribution+'</div>';
  } else if(s.type === 'timeline' || s.type === 'values'){
    html += headingStack(s.heading);
    html += '<div class="slide-list">' + s.items.map(function(it){
      const badge = s.type === 'timeline' ? it.year : it.num;
      return '<div class="slide-list-item">'
           +   '<span class="slide-list-num">'+badge+'</span>'
           +   '<div class="slide-list-title">'+it.title+'</div>'
           +   '<p class="slide-list-text">'+it.text+'</p>'
           + '</div>';
    }).join('') + '</div>';
  }
  slideInner.innerHTML = html;
  slideInner.scrollTop = 0;
  slideContent.classList.add('visible');
}
renderSlideContent(current);

function updateNav(idx){
  const sw = parseFloat(navUl.dataset.sw) || window.innerWidth * 0.5;
  navUl.style.transform=`translateX(${-(sw*idx-(window.innerWidth/2-sw/2))}px)`;
  Array.from(ctrlUl.children).forEach((li,i)=>li.classList.toggle('is-current',i===idx));
  knob.style.transform=`translateX(${idx*(ctrlUl.offsetWidth/TOTAL)}px)`;
}
updateNav(current);

function goTo(idx){
  if(idx<0||idx>=TOTAL||transitioning||idx===current) return;
  transitioning=true;
  const prev=current; current=idx;
  const tA=textures[idx], tB=textures[prev];
  uniforms.uTexB.value=tB||placeholder; uniforms.uHasTexB.value=tB?1:0;
  uniforms.uTexA.value=tA||placeholder; uniforms.uHasTexA.value=tA?1:0;
  uniforms.uBlend.value=0;
  transitionStart=performance.now();
  updateNav(idx);
  updateVideoBackground(idx);
  renderSlideContent(idx);
  setTimeout(()=>transitioning=false, TRANS_DUR+100);
}

// Moving forward past the symbol slide blends into the main site's About
// photo, then hands off to wearelvo.com — same technique as the reverse
// trip on the main site.
function goToSecretHome(){
  if(transitioning) return;
  transitioning=true;
  const tB=textures[current];
  uniforms.uTexB.value=tB||placeholder; uniforms.uHasTexB.value=tB?1:0;
  uniforms.uTexA.value=homeTexture||placeholder; uniforms.uHasTexA.value=homeTexture?1:0;
  uniforms.uBlend.value=0;
  transitionStart=performance.now();
  aboutHero.classList.remove('visible');
  slideContent.classList.remove('visible');
  setTimeout(()=>{ window.location.href = HOME_URL; }, TRANS_DUR+80);
}

document.getElementById('return-link-a').addEventListener('click', e=>{
  e.preventDefault();
  goToSecretHome();
});

Array.from(ctrlUl.children).forEach(li=>li.addEventListener('click',()=>goTo(+li.dataset.idx)));

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ if(current===SYMBOL_IDX) goToSecretHome(); else goTo(current+1); }
  if(e.key==='ArrowLeft' ||e.key==='ArrowUp')   goTo(current-1);
});

let wCool=false;
window.addEventListener('wheel',e=>{
  if(wCool)return; wCool=true;
  if(e.deltaX>30||e.deltaY>30){ if(current===SYMBOL_IDX) goToSecretHome(); else goTo(current+1); }
  else if(e.deltaX<-30||e.deltaY<-30) goTo(current-1);
  setTimeout(()=>wCool=false,900);
},{passive:true});

let stageDragX=0, stageDragging=false, stageDelta=0;

document.getElementById('stage').addEventListener('pointerdown',e=>{
  stageDragging=true; stageDragX=e.clientX; stageDelta=0;
  e.preventDefault();
},{passive:false});

window.addEventListener('touchstart', e=>{
  stageDragging=true;
  stageDragX=e.touches[0].clientX;
  stageDelta=0;
},{passive:true});

window.addEventListener('touchmove', e=>{
  if(stageDragging) stageDelta=e.touches[0].clientX - stageDragX;
},{passive:true});

window.addEventListener('touchend', ()=>{
  if(!stageDragging) return;
  stageDragging=false;
  if(stageDelta < -50){ if(current===SYMBOL_IDX) goToSecretHome(); else goTo(current+1); }
  else if(stageDelta > 50) goTo(current-1);
  stageDelta=0;
});

window.addEventListener('pointermove',e=>{ if(stageDragging && e.pointerType!=='touch') stageDelta=e.clientX-stageDragX; });
window.addEventListener('pointerup',()=>{
  if(!stageDragging) return;
  stageDragging=false;
  if(stageDelta<-50){ if(current===SYMBOL_IDX) goToSecretHome(); else goTo(current+1); }
  else if(stageDelta>50) goTo(current-1);
  stageDelta=0;
});

if(!isTouchDevice){
  const CURSOR_PARTICLE_SRC = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAATCAYAAACk9eypAAAAAXNSR0IArs4c6QAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAAhGVYSWZNTQAqAAAACAAFARIAAwAAAAEAAQAAARoABQAAAAEAAABKARsABQAAAAEAAABSASgAAwAAAAEAAgAAh2kABAAAAAEAAABaAAAAAAAAAEgAAAABAAAASAAAAAEAA6ABAAMAAAABAAEAAKACAAQAAAABAAAADKADAAQAAAABAAAAEwAAAAAChpcNAAAACXBIWXMAAAsTAAALEwEAmpwYAAABWWlUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPHg6eG1wbWV0YSB4bWxuczp4PSJhZG9iZTpuczptZXRhLyIgeDp4bXB0az0iWE1QIENvcmUgNS40LjAiPgogICA8cmRmOlJERiB4bWxuczpyZGY9Imh0dHA6Ly93d3cudzMub3JnLzE5OTkvMDIvMjItcmRmLXN5bnRheC1ucyMiPgogICAgICA8cmRmOkRlc2NyaXB0aW9uIHJkZjphYm91dD0iIgogICAgICAgICAgICB4bWxuczp0aWZmPSJodHRwOi8vbnMuYWRvYmUuY29tL3RpZmYvMS4wLyI+CiAgICAgICAgIDx0aWZmOk9yaWVudGF0aW9uPjE8L3RpZmY6T3JpZW50YXRpb24+CiAgICAgIDwvcmRmOkRlc2NyaXB0aW9uPgogICA8L3JkZjpSREY+CjwveDp4bXBtZXRhPgpMwidZAAABqElEQVQoFY3SPUvDQBgH8BREpRHExYiDgmLFl6WC+AYmWeyLg4i7buJX8DMpOujgyxGvUYeCgzhUQUSKKLUS0+ZyptXh8Z5Ti621ekPyJHl+uftfomhaf9Ei5JyxXKfynyEA6EYcLHpwyflT958GAQ7DTABNHd8EbtDbEH2BD5QEQmi2mM8P/Iq+A0SzszEg+3sPjDnDdVEtQKQbMUidHD3xVzf6A9UDEmEm+8h9KTqTVUjT+vB53aHrCbAPiceYq1dQI1Aqv4EhMll0jzv+Y0yiRgCnLRSYyDQHVoqUXe4uKL9l+L7GXC4vkMhE6eW/AOJs9k583ORDUyXMZ8F5SVHVVnllmPNKSFagAJ5DofaqGXw/gHBYg51dIldkmknY3tguv3jOtHR4+MqAzaraJXbEhqHhcQlwGSOi5pytVQHZLN5s0WNe8HPrLYlFsO20RPHkImxsbmHdLJFI76th7Z4SeuF53hTeFLvhRCJRCTKZKxgdnRDbW+iozFJbBMw14/ElwGYc0egMBMFzT21f5Rog33Z7dX02GBm7WV5ZfT5Nn5bE3zuCDe9UxdTpNvK+5AAAAABJRU5ErkJggg==';

  const CURSOR_PARTICLE_COUNT = 15;
  const CURSOR_RATE = 0.4;

  const cursorImage = new Image();
  cursorImage.src = CURSOR_PARTICLE_SRC;

  const trailCanvas = document.createElement('canvas');
  trailCanvas.id = 'trailing-cursor-canvas';
  trailCanvas.width = window.innerWidth;
  trailCanvas.height = window.innerHeight;
  document.body.appendChild(trailCanvas);
  const trailCtx = trailCanvas.getContext('2d');

  window.addEventListener('resize', ()=>{
    trailCanvas.width = window.innerWidth;
    trailCanvas.height = window.innerHeight;
  });

  let cursorPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
  let cursorParticles = [];
  let cursorParticlesInitted = false;

  window.addEventListener('mousemove', e=>{
    cursorPos.x = e.clientX;
    cursorPos.y = e.clientY;
    if(!cursorParticlesInitted){
      cursorParticlesInitted = true;
      for(let i=0;i<CURSOR_PARTICLE_COUNT;i++){
        cursorParticles.push({ x: cursorPos.x, y: cursorPos.y });
      }
    }
  });

  (function trailLoop(){
    requestAnimationFrame(trailLoop);
    trailCtx.clearRect(0,0,trailCanvas.width,trailCanvas.height);
    if(!cursorParticlesInitted || !cursorImage.complete) return;
    let x = cursorPos.x, y = cursorPos.y;
    cursorParticles.forEach((p, i)=>{
      const next = cursorParticles[i+1] || cursorParticles[0];
      p.x = x; p.y = y;
      trailCtx.drawImage(cursorImage, p.x, p.y);
      x += (next.x - p.x) * CURSOR_RATE;
      y += (next.y - p.y) * CURSOR_RATE;
    });
  })();
}

(function animate(ts){
  requestAnimationFrame(animate);
  uniforms.uTime.value=ts*0.001;
  if(uniforms.uBlend.value<1){
    const t=Math.min((ts-transitionStart)/TRANS_DUR,1);
    uniforms.uBlend.value=1-(1-t)*(1-t)*(1-t);
  }
  renderer.render(scene,camera);
})();

const stageEl = document.getElementById('stage');
let mouseX=0, mouseY=0, tiltX=0, tiltY=0;
if(!isTouchDevice){
  window.addEventListener('mousemove', e=>{
    mouseX=(e.clientX/window.innerWidth-0.5)*2;
    mouseY=(e.clientY/window.innerHeight-0.5)*2;
  });
  window.addEventListener('mouseleave',()=>{ mouseX=0; mouseY=0; });
  (function tiltLoop(){
    requestAnimationFrame(tiltLoop);
    tiltX+=(mouseX-tiltX)*0.05; tiltY+=(mouseY-tiltY)*0.05;
    const rx=tiltY*4, ry=-tiltX*4, tx=tiltX*10, ty=tiltY*6;
    stageEl.style.transform=`perspective(1200px) rotateX(${rx}deg) rotateY(${ry}deg) translate(${tx}px,${ty}px)`;
  })();
}
